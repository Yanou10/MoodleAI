
{% extends "layout.html" %}

{% block content %}
<div class="container py-4">
  <h1 class="mb-4 text-center text-primary">Mon emploi du temps</h1>

  <div id="calendar"></div>
</div>

<!-- FullCalendar CSS & JS -->
<link href='https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.css' rel='stylesheet' />
<script src='https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.js'></script>

<script>
  document.addEventListener('DOMContentLoaded', function() {
    const calendarEl = document.getElementById('calendar');
    const calendar = new FullCalendar.Calendar(calendarEl, {
      initialView: 'timeGridWeek',
      locale: 'fr',
      firstDay: 1,
      slotMinTime: "07:00:00",
      slotMaxTime: "20:00:00",
      headerToolbar: {
        left: 'prev,next today',
        center: 'title',
        right: 'timeGridWeek,timeGridDay'
      },
      eventDidMount: function(info) {
        const tooltip = `
          <strong>Professeur :</strong> ${info.event.extendedProps.professor}<br>
          <strong>Salle :</strong> ${info.event.extendedProps.room}<br>
          <strong>Description :</strong> ${info.event.extendedProps.description}
        `;
        info.el.setAttribute('title', tooltip);
      },
      events: {{ schedule | tojson }}
    });
    calendar.render();
  });
</script>
{% endblock %}
